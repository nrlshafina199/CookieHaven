<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Orders | CookieHaven Admin</title>
    <style>
        :root { --primary: #5d4037; --accent: #8d6e63; --bg: #f8f1e7; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; }

        .sidebar { width: 260px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { margin-bottom: 30px; text-align: center; }
        .sidebar nav a { display: block; color: #d7ccc8; text-decoration: none; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; }
        .sidebar nav a:hover, .sidebar nav a.active { background: rgba(255,255,255,0.1); color: white; }

        .content { margin-left: 260px; padding: 40px; width: 100%; box-sizing: border-box; }
        .orders-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .orders-table th { background: var(--primary); color: white; padding: 15px; text-align: left; }
        .orders-table td { padding: 15px; border-bottom: 1px solid #eee; }

        .btn-view { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 10% auto; padding: 30px; border-radius: 15px; width: 50%; max-width: 600px; position: relative; }
        .close { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #aaa; }
        .item-list { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .item-list th { border-bottom: 2px solid var(--bg); text-align: left; padding: 10px; }
        .item-list td { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>

<body>
<aside class="sidebar">
    <h2>🍪 CookieHaven</h2>
    <nav>
        <a href="/admin/dashboard">🏠 Dashboard</a>
        <a href="/admin/products">📦 Manage Products</a>
        <a href="/admin/orders" class="active">📋 View Orders</a>
        <a href="/admin/feedback">💬 Feedback</a>
        <a href="/admin/reports">📊 Reports</a>
        <a href="/admin/logout">🚪 Logout</a>
    </nav>
</aside>

<main class="content">
    <h1>Incoming Orders</h1>
    <table class="orders-table">
        <thead>
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="orderTableBody">
        <tr><td colspan="5" style="text-align:center;">Loading orders...</td></tr>
        </tbody>
    </table>
</main>

<div id="orderModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color: var(--primary);">Order Items</h2>
        <div id="orderDetails"></div>
    </div>
</div>

<script>
    function loadOrders() {
        fetch('/admin/orders/api')
            .then(res => res.json())
            .then(orders => renderTable(orders));
    }

    function renderTable(orders) {
        const body = document.getElementById('orderTableBody');

        if (!orders.length) {
            body.innerHTML = `<tr><td colspan="5" style="text-align:center;">No orders found.</td></tr>`;
            return;
        }

        body.innerHTML = orders.map(o => `
            <tr>
                <td>#${o.orderId}</td>
                <td><strong>${o.customerName}</strong><br><small>${o.phone}</small></td>
                <td style="color:#a52a2a;font-weight:bold;">RM ${o.total.toFixed(2)}</td>
                <td>
                    <select onchange="updateStatus(${o.orderId}, this.value)">
                        ${["Pending","Preparing","Shipped","Delivered"].map(s =>
            `<option value="${s}" ${s===o.status?"selected":""}>${s}</option>`
        ).join("")}
                    </select>
                </td>
                <td>
                    <button class="btn-view" onclick="viewItems('${o.orderId}')">
                        View Items
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function updateStatus(orderId, status) {
        fetch(`/admin/orders/${orderId}/status`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `status=${encodeURIComponent(status)}`
        });
    }

    function viewItems(orderId) {
        fetch(`/admin/orders/items?orderId=${orderId}`)
            .then(res => res.json())
            .then(items => {
                document.getElementById('modalTitle').innerText =
                    `Cookies for Order #${orderId}`;

                document.getElementById('orderDetails').innerHTML = `
                    <table class="item-list">
                        <thead>
                        <tr><th>Cookie Name</th><th style="text-align:center;">Quantity</th></tr>
                        </thead>
                        <tbody>
                            ${items.map(i => `
                                <tr>
                                    <td>${i.productName}</td>
                                    <td style="text-align:center;">${i.quantity}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                `;

                document.getElementById('orderModal').style.display = "block";
            });
    }

    function closeModal() {
        document.getElementById('orderModal').style.display = "none";
    }

    window.onclick = e => {
        if (e.target === document.getElementById('orderModal')) closeModal();
    };

    loadOrders();
</script>
</body>
</html>
