<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Products | CookieHaven</title>
    <style>
        :root { --primary: #5d4037; --accent: #8d6e63; --bg: #f8f1e7; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: #3e2723; }

        .sidebar { width: 260px; background: var(--primary); color: var(--white); display: flex; flex-direction: column; padding: 20px; }
        .sidebar h2 { margin-bottom: 40px; border-bottom: 1px solid var(--accent); padding-bottom: 15px; }
        .sidebar a { text-decoration: none; color: #d7ccc8; padding: 15px; margin-bottom: 8px; border-radius: 8px; display: flex; align-items: center; }
        .sidebar a:hover { background: rgba(255, 255, 255, 0.1); color: var(--white); }
        .sidebar a.active { background: var(--accent); color: var(--white); font-weight: bold; }
        .sidebar a span { margin-right: 12px; }

        .content { flex: 1; padding: 40px; overflow-y: auto; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; }

        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }

        .btn { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn:hover { background: var(--accent); }

        .btn-del { background: #c62828; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8em; }

        /* Table Styling */
        .table-container { overflow-x: auto; } /* Allows scrolling if table gets too wide */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 900px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9em; vertical-align: top; }
        th { background: var(--primary); color: white; white-space: nowrap; }

        /* Column Width adjustments */
        td.desc-col { max-width: 200px; font-size: 0.85em; color: #555; }
        td.ingr-col { max-width: 150px; font-size: 0.85em; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>CookieHaven</h2>
    <a href="/admin/dashboard"><span>📊</span> Dashboard</a>
    <a href="/admin/products" class="active"><span>🍪</span> Manage Products</a>
    <a href="/admin/orders"><span>📦</span> View Orders</a>
    <a href="/admin/reviews"><span>⭐</span> Customer Feedback</a>
    <a href="/admin/reports"><span>📈</span> Sales Reports</a>
    <a href="/admin/logout"><span>🚪</span> Logout</a>
</div>

<div class="content">
    <h1>Manage Product Catalog</h1>

    <div class="card">
        <h3>➕ Add New Cookie</h3>
        <form id="addProductForm">
            <label>Product ID *</label>
            <input type="text" name="productId" placeholder="e.g., KIN01" required>

            <label>Cookie Name *</label>
            <input type="text" name="name" placeholder="e.g., Kinderella" required>

            <label>Price (RM) *</label>
            <input type="number" step="0.01" name="price" placeholder="2.00" required>

            <label>Stock Quantity *</label>
            <input type="number" name="stock" placeholder="20" required>

            <label>Description</label>
            <textarea name="description" rows="2" placeholder="Describe the cookie..."></textarea>

            <label>Ingredients</label>
            <input type="text" name="ingredients" placeholder="Flour, Sugar...">

            <label>Allergens</label>
            <input type="text" name="allergens" placeholder="None">

            <button type="submit" class="btn" id="submitBtn">Add Product to Catalog</button>
        </form>
    </div>

    <div class="card">
        <h3>Current Products</h3>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Description</th>
                    <th>Ingredients</th>
                    <th>Allergens</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="product-table">
                <tr><td colspan="8">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", loadProducts);

    async function loadProducts() {
        const tbody = document.getElementById("product-table");
        try {
            const res = await fetch("/admin/products/api");
            const products = await res.json();

            if(products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8">No products found.</td></tr>';
                return;
            }

            // Expanded Table Logic
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td><strong>${p.id}</strong></td>
                    <td>${p.name}</td>
                    <td>RM ${p.price.toFixed(2)}</td>
                    <td style="color:${p.stock < 10 ? 'red' : 'green'}; font-weight:bold;">${p.stock}</td>
                    <td class="desc-col">${p.description || '-'}</td>
                    <td class="ingr-col">${p.ingredients || '-'}</td>
                    <td>${p.allergens || 'None'}</td>
                    <td><button class="btn-del" onclick="deleteProduct('${p.id}')">Delete</button></td>
                </tr>
            `).join('');
        } catch(e) { console.error(e); }
    }

    // SIMPLIFIED SUBMIT (No Image Logic)
    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const params = new URLSearchParams(formData);
        params.append("action", "add");

        try {
            const res = await fetch("/admin/products/api", { method: "POST", body: params });
            const data = await res.json();

            if(data.success) {
                alert("Success! Product Added.");
                e.target.reset();
                loadProducts();
            } else {
                alert("Failed: " + data.message);
            }
        } catch(err) {
            console.error(err);
            alert("Error sending data.");
        }
    });

    async function deleteProduct(id) {
        if(!confirm("Delete this product?")) return;
        const params = new URLSearchParams();
        params.append("action", "delete");
        params.append("productId", id);
        await fetch("/admin/products/api", { method: "POST", body: params });
        loadProducts();
    }
</script>

</body>
</html>
